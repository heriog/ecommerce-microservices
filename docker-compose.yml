version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev_password@postgres:5432/payment_db
      FLASK_ENV: production
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  catalogue-service:
    build:
      context: ./catalogue-service
      dockerfile: Dockerfile
    container_name: catalogue-service
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev_password@postgres:5432/catalogue_db
      FLASK_ENV: production
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev_password@postgres:5432/cart_db
      FLASK_ENV: production
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:

networks:
  default:
    name: ecommerce-network
